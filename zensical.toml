[project]
site_name = "Treestamps"
site_url = "https://treestamps.readthedocs.io/"
site_author = "AJ"
site_description = "Treestamps records per-file timestamps for recursive operations on directory trees so programs can skip unchanged files."
nav = ["NEWS.md"]
docs_dir = "docs"

[project.theme]
variant = "modern"
features = ["content.code.copy", "navigation.footer", "search.highlight"]

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

[project.theme.palette]
scheme = "slate"
primary = "deep purple"
accent = "deep orange"

[project.markdown_extensions]
smarty = {}
toc.permalink = true

[project.plugins.minify]
minify_html = true
minify_inline_js = true
minify_inline_css = true

[project.plugins.mkdocstrings]
default_handler = "python"

[project.plugins.api-autonav]
modules = ["treestamps"]
